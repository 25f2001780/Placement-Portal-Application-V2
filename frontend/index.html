<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Portal Application</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <div id="app" v-cloak></div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.2.4/dist/vue-router.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.8.4/dist/vue3-sfc-loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>

  <script>
    // Axios config
    axios.defaults.baseURL = 'http://127.0.0.1:5000';
    axios.interceptors.request.use(config => {
      const token = localStorage.getItem('token');
      if (token) {
        config.headers.Authorization = `Bearer ${token}`;
      }
      return config;
    });

    axios.interceptors.response.use(
      response => response,
      error => {
        if (error.response && error.response.status === 401) {
          localStorage.removeItem('token');
          localStorage.removeItem('role');
          localStorage.removeItem('name');
          localStorage.removeItem('user_id');
          if (window.location.hash !== '#/login') {
            window.location.hash = '#/login';
          }
        }
        return Promise.reject(error);
      }
    );

    // sfc loader config
    const options = {
      moduleCache: {
        vue: Vue,
        'vue-router': VueRouter
      },
      async getFile(url) {
        const res = await fetch(url);
        if (!res.ok)
          throw Object.assign(new Error(res.statusText + ' ' + url), { res });
        return {
          getContentData: asBinary => asBinary ? res.arrayBuffer() : res.text(),
        }
      },
      addStyle(textContent) {
        const style = Object.assign(document.createElement('style'), { textContent });
        const ref = document.head.getElementsByTagName('style')[0] || null;
        document.head.insertBefore(style, ref);
      },
    };

    const loadSfc = window['vue3-sfc-loader'].loadModule;

    // Routes
    const routes = [
      { path: '/', component: () => loadSfc('./src/views/Home.vue', options) },
      { path: '/login', component: () => loadSfc('./src/views/Login.vue', options) },
      { path: '/register', component: () => loadSfc('./src/views/Register.vue', options) },
      { path: '/admin', component: () => loadSfc('./src/views/AdminDashboard.vue', options) },
      { path: '/company', component: () => loadSfc('./src/views/CompanyDashboard.vue', options) },
      { path: '/student', component: () => loadSfc('./src/views/StudentDashboard.vue', options) },
      { path: '/change-password', component: () => loadSfc('./src/views/ChangePassword.vue', options) },
      { path: '/company/profile', component: () => loadSfc('./src/views/CompanyProfile.vue', options) },
      { path: '/student/profile', component: () => loadSfc('./src/views/StudentProfile.vue', options) }
    ];

    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes,
    });

    // Bootstrap Vue app
    loadSfc('./src/App.vue', options).then(App => {
      const app = Vue.createApp(App);
      app.use(router);
      app.mount('#app');
    });
  </script>
</body>
</html>
